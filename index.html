<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Iron Fist Boxing Gym - manage gym tasks and check in athletes.">
  <title>Home | Iron Fist Boxing Gym</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- The shared header is added by layout.js. -->
  <header id="site-header" class="sticky-top"></header>

  <main class="container my-4">
    <!-- Welcome text and a shortcut to the tasks page. -->
    <section class="hero p-5 rounded text-center mb-4">
      <h1>Welcome to Iron Fist Boxing Gym</h1>
      <p>We train beginners and competitors in a friendly, hard-working gym.</p>
      <p>With this app, coaches can manage gym tasks and athletes can check in to class.</p>
      <a href="tasks.html" class="btn btn-light btn-lg">Go to Tasks</a>
    </section>

    <!-- These lists are filled in by home.js. -->
    <div class="row g-4">
      <section class="col-md-6" aria-labelledby="activityTitle">
        <h2 id="activityTitle" class="h4">Latest Activity</h2>
        <ul id="activityList" class="list-group"></ul>
      </section>

      <section class="col-md-6" aria-labelledby="quoteTitle">
        <h2 id="quoteTitle" class="h4">Quote of the Day</h2>
        <blockquote id="quote" class="blockquote">Loading...</blockquote>
      </section>
    </div>
  </main>

  <!-- The shared footer is added by layout.js. -->
  <footer id="site-footer" class="border-top mt-4"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
