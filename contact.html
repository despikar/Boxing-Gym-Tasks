<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Iron Fist Boxing Gym.">
  <title>Contact | Iron Fist Boxing Gym</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- The shared header is added by layout.js. -->
  <header id="site-header" class="sticky-top"></header>

  <main class="container my-4">
    <h1>Contact Us</h1>
    <div class="row g-4">

      <!-- The form checks each field before showing the confirmation. -->
      <section class="col-md-6" aria-labelledby="formTitle">
        <h2 id="formTitle" class="h4">Send a message</h2>
        <form id="contactForm" novalidate>
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input id="name" type="text" class="form-control" required minlength="2">
            <div class="invalid-feedback">Please enter your name (at least 2 letters).</div>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input id="email" type="email" class="form-control" required>
            <div class="invalid-feedback">Please enter a valid email.</div>
          </div>
          <div class="mb-3">
            <label for="subject" class="form-label">Subject</label>
            <input id="subject" type="text" class="form-control" required>
            <div class="invalid-feedback">Please enter a subject.</div>
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea id="message" class="form-control" rows="4" required minlength="10"></textarea>
            <div class="invalid-feedback">Please write a message (at least 10 characters).</div>
          </div>
          <button type="submit" class="btn btn-danger">Send</button>
        </form>
      </section>

      <!-- Map and social links for finding the gym. -->
      <section class="col-md-6" aria-labelledby="mapTitle">
        <h2 id="mapTitle" class="h4">Find us</h2>
        <iframe title="Map showing the gym location" class="w-100 border-0 rounded" height="300" loading="lazy"
                src="https://www.google.com/maps?q=Athens,Greece&output=embed"></iframe>
        <p class="mt-3">
          Follow us:
          <a href="https://instagram.com" aria-label="Instagram">Instagram</a> |
          <a href="https://facebook.com" aria-label="Facebook">Facebook</a>
        </p>
      </section>
    </div>

    <!-- contact.js fills this window with the submitted details. -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5" id="modalTitle">Message sent!</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="modalBody"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- The shared footer is added by layout.js. -->
  <footer id="site-footer" class="border-top mt-4"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
