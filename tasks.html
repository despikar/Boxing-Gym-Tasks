<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Add, edit, filter and complete gym tasks.">
  <title>Tasks | Iron Fist Boxing Gym</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="site-header" class="sticky-top"></header>

  <main class="container my-4">
    <h1>Gym Tasks</h1>

    <section class="row text-center g-3 mb-4" aria-label="Task summary">
      <div class="col-4"><div class="border rounded p-2">Total<br><strong id="totalCount">0</strong></div></div>
      <div class="col-4"><div class="border rounded p-2">Pending<br><strong id="pendingCount">0</strong></div></div>
      <div class="col-4"><div class="border rounded p-2">Completed<br><strong id="completedCount">0</strong></div></div>
    </section>

    <form id="taskForm" class="row g-3 mb-4" novalidate>
      <div class="col-md-4">
        <label for="taskName" class="form-label">Task name</label>
        <input id="taskName" type="text" class="form-control" required>
        <div class="invalid-feedback">Please enter a task name.</div>
      </div>
      <div class="col-md-4">
        <label for="taskDesc" class="form-label">Description</label>
        <input id="taskDesc" type="text" class="form-control" required>
        <div class="invalid-feedback">Please enter a description.</div>
      </div>
      <div class="col-md-4">
        <label for="taskDue" class="form-label">Due date</label>
        <input id="taskDue" type="date" class="form-control" required>
        <div class="invalid-feedback">Please pick a due date.</div>
      </div>
      <div class="col-12">
        <button id="saveBtn" type="submit" class="btn btn-danger">Add Task</button>
      </div>
    </form>

    <section class="row g-3 mb-3" aria-label="Search, filter and sort">
      <div class="col-md-4">
        <label for="searchBox" class="form-label">Search</label>
        <input id="searchBox" type="search" class="form-control" placeholder="Type to search...">
      </div>
      <div class="col-md-4">
        <label for="statusFilter" class="form-label">Show</label>
        <select id="statusFilter" class="form-select">
          <option value="all">All</option>
          <option value="pending">Pending</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="sortBy" class="form-label">Sort by</label>
        <select id="sortBy" class="form-select">
          <option value="due">Due date</option>
          <option value="name">Task name</option>
        </select>
      </div>
    </section>

    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr><th>Name</th><th>Description</th><th>Due</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="taskTable"></tbody>
      </table>
    </div>
  </main>

  <footer id="site-footer" class="border-top mt-4"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/tasks.js"></script>
</body>
</html>
